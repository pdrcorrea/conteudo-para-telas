<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView • Previsão do Tempo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
.weather{min-height:0;display:grid;grid-template-columns:minmax(0,45%) minmax(0,55%);gap:clamp(24px,3vw,46px)}.current{min-height:0;display:flex;flex-direction:column;justify-content:center}.hero{display:grid;grid-template-columns:minmax(150px,40%) minmax(0,60%);align-items:center;gap:18px}.orb{width:min(21vw,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.15),rgba(105,207,242,.08) 46%,rgba(255,255,255,.025) 70%);border:1px solid rgba(255,255,255,.1)}.orb::before,.orb::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07)}.orb::before{inset:12%;animation:pvRing 24s linear infinite}.orb::after{inset:25%;animation:pvRing 17s linear infinite reverse}.wx{font-size:clamp(84px,8vw,132px);color:#d8f2ff;z-index:1;animation:floatWx 4.8s ease-in-out infinite}.temp{font-size:clamp(84px,8.1vw,136px);font-weight:300;letter-spacing:-.06em;line-height:.84}.condition{margin-top:16px;font-size:clamp(18px,1.6vw,26px);font-weight:650}.range{margin-top:14px;display:flex;gap:16px;color:var(--pv-soft);font-size:clamp(14px,1.05vw,17px)}.range b{color:#fff}.range b.min{color:var(--pv-sky)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}.metric{min-height:104px;border-radius:20px;background:rgba(255,255,255,.075);border:1px solid var(--pv-line);padding:14px;display:flex;flex-direction:column;justify-content:center}.metric-top{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:var(--pv-sky)}.metric-top span:first-child{font-size:24px}.metric-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pv-soft)}.metric-value{font-size:clamp(19px,1.65vw,27px);font-weight:650;white-space:nowrap}.forecast{min-height:0;display:flex;flex-direction:column;justify-content:center}.forecast-title{font-size:clamp(13px,1vw,17px);font-weight:750;letter-spacing:.12em;text-transform:uppercase;margin-bottom:13px;color:var(--pv-soft)}.days{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:9px;min-height:0}.day{display:grid;grid-template-columns:78px 50px minmax(0,1fr) 118px;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--pv-line)}.day.today{background:rgba(255,255,255,.11);border-color:rgba(105,207,242,.34)}.day-name{font-size:clamp(12px,1vw,16px);font-weight:700;text-transform:uppercase}.day-date{font-size:10px;color:rgba(255,255,255,.45);margin-top:4px}.day-icon{font-size:36px;color:#d8f2ff}.day-desc{font-size:clamp(12px,1vw,16px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rain{margin-top:4px;font-size:10px;color:var(--pv-soft)}.temps{display:flex;justify-content:flex-end;gap:12px;font-size:clamp(15px,1.25vw,20px);font-weight:650}.temps .min{color:var(--pv-sky)}.alert{position:absolute;z-index:8;left:var(--pv-safe);right:var(--pv-safe);top:calc(var(--pv-safe) + 70px);display:none;align-items:center;gap:14px;padding:14px 18px;border-radius:20px;background:rgba(118,67,10,.92);border:1px solid rgba(255,210,120,.34);backdrop-filter:blur(12px);box-shadow:0 14px 36px rgba(0,0,0,.14)}.alert.show{display:flex}.alert-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.10);flex:0 0 auto}.alert-icon span{color:#ffd281}.alert-text{min-width:0}.alert-title{font-size:14px;font-weight:750}.alert-note{font-size:11px;color:rgba(255,255,255,.75);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.credit{font-size:9px;color:rgba(255,255,255,.38);letter-spacing:.07em;text-transform:uppercase}.pv-footer{justify-content:space-between}.pv-footer img{position:absolute;left:50%;transform:translateX(-50%)}@keyframes floatWx{50%{transform:translateY(-5px)}}@media(orientation:portrait),(max-aspect-ratio:4/5){.weather{grid-template-columns:1fr;grid-template-rows:minmax(0,43%) minmax(0,57%);gap:20px}.orb{width:min(33vw,280px)}.metrics{grid-template-columns:repeat(4,1fr)}.day{grid-template-columns:80px 48px minmax(0,1fr) 120px}}@media(orientation:landscape) and (max-height:760px){.weather{gap:26px}.orb{width:min(17vw,220px)}.wx{font-size:96px}.temp{font-size:102px}.condition{font-size:18px}.metric{min-height:82px;padding:10px}.day{padding:6px 11px}.alert{top:72px}}
</style></head><body><div class="pv-ambient"></div><div class="pv-shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">partly_cloudy_day</span></div><div><div class="pv-title">Previsão do Tempo</div><div style="margin-top:6px;color:var(--pv-soft);font-size:12px" id="place">Localizando...</div></div></div><div class="pv-source"><span class="material-symbols-outlined">schedule</span><span id="clock">--:--</span></div></header><div class="alert" id="alert"><div class="alert-icon"><span class="material-symbols-outlined">warning</span></div><div class="alert-text"><div class="alert-title" id="alertTitle">Alerta meteorológico</div><div class="alert-note" id="alertNote"></div></div></div><main class="weather"><section class="current"><div class="hero"><div class="orb"><span class="material-symbols-outlined wx" id="wx">cloud</span></div><div><div class="temp" id="temp">--°</div><div class="condition" id="condition">Atualizando...</div><div class="range"><span>mín <b class="min" id="min">--°</b></span><span>máx <b id="max">--°</b></span></div></div></div><div class="metrics"><div class="metric"><div class="metric-top"><span class="material-symbols-outlined">device_thermostat</span><span class="metric-label">Sensação</span></div><div class="metric-value" id="feel">--°</div></div><div class="metric"><div class="metric-top"><span class="material-symbols-outlined">air</span><span class="metric-label">Vento</span></div><div class="metric-value" id="wind">--</div></div><div class="metric"><div class="metric-top"><span class="material-symbols-outlined">opacity</span><span class="metric-label">Umidade</span></div><div class="metric-value" id="humidity">--</div></div><div class="metric"><div class="metric-top"><span class="material-symbols-outlined">water_drop</span><span class="metric-label">Chuva</span></div><div class="metric-value" id="rain">--</div></div></div></section><section class="forecast"><div class="forecast-title">Próximos dias</div><div class="days" id="days"></div></section></main><footer class="pv-footer"><span class="credit">Open-Meteo • alertas INMET via RadarMeteorológico</span><img src="../../assets/logo/pontoview-logo-white.png" alt="PontoView"><span></span></footer></div><script src="../shared/pv.js"></script><script>
const $=id=>document.getElementById(id),el={place:$('place'),clock:$('clock'),wx:$('wx'),temp:$('temp'),condition:$('condition'),min:$('min'),max:$('max'),feel:$('feel'),wind:$('wind'),humidity:$('humidity'),rain:$('rain'),days:$('days'),alert:$('alert'),alertTitle:$('alertTitle'),alertNote:$('alertNote')};let loc={lat:Number(PV.qs('lat','NaN')),lon:Number(PV.qs('lon','NaN')),city:PV.qs('cidade',''),uf:PV.qs('uf',''),ibge:PV.qs('ibge','')};const codeText=c=>({0:'Céu limpo',1:'Predomínio de sol',2:'Parcialmente nublado',3:'Nublado',45:'Neblina',48:'Neblina',51:'Garoa leve',53:'Garoa',55:'Garoa forte',61:'Chuva leve',63:'Chuva',65:'Chuva forte',71:'Neve leve',73:'Neve',75:'Neve forte',80:'Pancadas de chuva',81:'Pancadas de chuva',82:'Pancadas fortes',95:'Trovoadas',96:'Trovoadas com granizo',99:'Trovoadas com granizo'}[c]||'Tempo variável');function icon(c,day=true){if(c===0||c===1)return day?'wb_sunny':'nightlight';if(c===2)return day?'partly_cloudy_day':'nightlight';if(c===3)return'cloud';if([45,48].includes(c))return'blur_on';if([51,53,55].includes(c))return'grain';if([61,63,65,80,81,82].includes(c))return'umbrella';if([71,73,75].includes(c))return'ac_unit';if([95,96,99].includes(c))return'thunderstorm';return'cloud'}function tick(){el.clock.textContent=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}async function locate(){if(Number.isFinite(loc.lat)&&Number.isFinite(loc.lon))return;for(const url of ['https://ipwho.is/?lang=pt','https://ipapi.co/json/']){try{const d=await PV.fetchJSON(url);const lat=Number(d.latitude),lon=Number(d.longitude);if(Number.isFinite(lat)&&Number.isFinite(lon)){loc={...loc,lat,lon,city:loc.city||d.city||'',uf:loc.uf||d.region_code||d.region||''};return}}catch{}}loc.lat=-19.5394;loc.lon=-40.6306;loc.city=loc.city||'Colatina';loc.uf=loc.uf||'ES'}async function resolveIbge(){if(loc.ibge||!loc.city)return;try{const d=await PV.fetchJSON('https://radarmeteorologico.com.br/api/v1/cidades?q='+encodeURIComponent(loc.city));const arr=Array.isArray(d)?d:Array.isArray(d.cidades)?d.cidades:Array.isArray(d.resultados)?d.resultados:[];const hit=arr.find(x=>String(x.uf||x.estado||'').toUpperCase()===String(loc.uf).toUpperCase())||arr[0];loc.ibge=String(hit?.ibge||hit?.codigo_ibge||hit?.codigo||'')}catch{}}function alertMatches(a){const blob=JSON.stringify(a).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const city=String(loc.city||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(loc.ibge&&blob.includes(loc.ibge))return true;if(city&&blob.includes(city))return true;return false}async function loadAlerts(){el.alert.classList.remove('show');if(!loc.uf)return;try{const d=await PV.fetchJSON('https://radarmeteorologico.com.br/api/v1/alertas?uf='+encodeURIComponent(loc.uf));const arr=Array.isArray(d.alertas)?d.alertas:Array.isArray(d)?d:[];const local=arr.filter(alertMatches);const a=local[0]||(!loc.city?arr[0]:null);if(!a)return;const event=a.evento||a.titulo||a.event||'Alerta meteorológico',sev=a.severidade||a.nivel||a.severity||'',risk=a.riscos||a.descricao||a.description||'';el.alertTitle.textContent=event+(sev?' • '+sev:'');el.alertNote.textContent=PV.clean(risk)||`Aviso meteorológico ativo para ${loc.city||loc.uf}. Consulte o INMET e a Defesa Civil.`;el.alert.classList.add('show')}catch{}}async function loadWeather(){await locate();await resolveIbge();el.place.textContent=[loc.city,loc.uf].filter(Boolean).join(' · ')||'Localização atual';const url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=6`;const d=await PV.fetchJSON(url);const c=d.current||{},day=Number(c.is_day)!==0;el.wx.textContent=icon(Number(c.weather_code),day);el.temp.textContent=Math.round(Number(c.temperature_2m))+'°';el.condition.textContent=codeText(Number(c.weather_code));el.feel.textContent=Math.round(Number(c.apparent_temperature))+'°';el.wind.textContent=Math.round(Number(c.wind_speed_10m))+' km/h';el.humidity.textContent=Math.round(Number(c.relative_humidity_2m))+'%';el.rain.textContent=Number(c.precipitation).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mm';const daily=d.daily||{};el.min.textContent=Math.round(Number(daily.temperature_2m_min?.[0]))+'°';el.max.textContent=Math.round(Number(daily.temperature_2m_max?.[0]))+'°';el.days.innerHTML='';(daily.time||[]).slice(0,5).forEach((t,i)=>{const dt=new Date(t+'T12:00:00'),wd=new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(dt).replace('.',''),dd=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit'}).format(dt),wc=Number(daily.weather_code?.[i]);const row=document.createElement('div');row.className='day '+(i===0?'today':'');row.innerHTML=`<div><div class="day-name">${i===0?'Hoje':wd}</div><div class="day-date">${dd}</div></div><span class="material-symbols-outlined day-icon">${icon(wc,true)}</span><div><div class="day-desc">${codeText(wc)}</div><div class="rain">Chuva ${Math.round(Number(daily.precipitation_probability_max?.[i]||0))}%</div></div><div class="temps"><span class="min">${Math.round(Number(daily.temperature_2m_min?.[i]))}°</span><span>${Math.round(Number(daily.temperature_2m_max?.[i]))}°</span></div>`;el.days.appendChild(row)});loadAlerts()}tick();setInterval(tick,1000);loadWeather().catch(()=>{el.condition.textContent='Previsão indisponível';el.place.textContent='Tente novamente em instantes'});setInterval(()=>loadWeather().catch(()=>{}),15*60*1000);
</script></body></html>
