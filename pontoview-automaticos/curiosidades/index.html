<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView • Curiosidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet">
<link rel="stylesheet" href="../shared/pontoview.css">
</head>
<body>
<div class="pv-ambient" aria-hidden="true"></div>
<div class="pv-shell" id="shell">
  <header class="pv-header">
    <div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">lightbulb</span></div><div class="pv-title">Curiosidades</div></div>
    <div class="pv-source"><span class="material-symbols-outlined">public</span><span>Wikipédia</span></div>
  </header>
  <main class="pv-stage">
    <section class="pv-copy pv-transition">
      <div class="pv-kicker">Você sabia?</div>
      <h1 class="pv-headline" id="title">Descobrindo algo interessante...</h1>
      <p class="pv-body" id="text"></p>
    </section>
    <section class="pv-media pv-transition" id="media">
      <div class="pv-media-fallback"><span class="material-symbols-outlined">auto_awesome</span></div>
      <img class="pv-image" id="image" alt="">
      <div class="pv-overlay"><span class="pv-pill" id="topic">Conhecimento</span><div class="pv-qr hidden" id="qr"><img id="qrImg" alt="QR Code"><div class="pv-qr-copy"><span class="pv-qr-title">Saiba mais</span><span class="pv-qr-hint">Aponte a câmera do celular</span></div></div></div>
      <div class="pv-progress"><span id="progress"></span></div>
    </section>
  </main>
  <footer class="pv-footer"><img src="../../assets/logo/pontoview-logo-white.png" alt="PontoView"></footer>
</div>
<script src="../shared/pv.js"></script>
<script>
const shell=document.getElementById('shell'),titleEl=document.getElementById('title'),textEl=document.getElementById('text'),media=document.getElementById('media'),image=document.getElementById('image'),topic=document.getElementById('topic'),qr=document.getElementById('qr'),qrImg=document.getElementById('qrImg'),progress=document.getElementById('progress');
const ROTATE=24000;let items=[],idx=0,timer=null,stopProgress=null;
const localFallback=[
  {title:'O polvo tem três corações',text:'Dois corações bombeiam sangue para as brânquias e um terceiro envia sangue para o restante do corpo.',topic:'Natureza'},
  {title:'A luz do Sol leva cerca de oito minutos até a Terra',text:'Mesmo viajando a aproximadamente 300 mil quilômetros por segundo, a luz precisa de alguns minutos para percorrer essa distância.',topic:'Ciência'},
  {title:'O Brasil abriga uma das maiores biodiversidades do planeta',text:'A variedade de biomas brasileiros reúne milhares de espécies de plantas, animais e microrganismos.',topic:'Brasil'},
  {title:'O som viaja mais rápido na água do que no ar',text:'As partículas ficam mais próximas na água, facilitando a transmissão das vibrações sonoras.',topic:'Ciência'},
  {title:'Algumas árvores podem viver milhares de anos',text:'Certas espécies de pinheiros e sequoias estão entre os organismos mais longevos conhecidos.',topic:'Natureza'}
];
function cleanExtract(text){const t=PV.clean(text);return t.length>520?t.slice(0,517).replace(/\s+\S*$/,'')+'…':t}
async function directData(){
  const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=random&grnnamespace=0&grnlimit=10&prop=extracts|pageimages|info&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=1200&inprop=url';
  const data=await PV.fetchJSON(url);
  const pages=Object.values(data?.query?.pages||{}).map(p=>({title:PV.clean(p.title),text:cleanExtract(p.extract),image:p.thumbnail?.source||'',link:p.fullurl||'',topic:'Conhecimento'}));
  const usable=pages.filter(p=>p.title&&p.text.length>=120&&!/^(Lista|Anexo|Categoria|Wikipédia:)/i.test(p.title));
  return {items:usable.length?usable:localFallback};
}
function render(item){
  titleEl.textContent=item.title||'Curiosidade';textEl.textContent=item.text||'';topic.textContent=item.topic||'Conhecimento';PV.setImage(image,media,item.image||'');
  if(item.link){qrImg.src=PV.qrUrl(item.link);qr.classList.remove('hidden');qrImg.onerror=()=>qr.classList.add('hidden')}else{qr.classList.add('hidden');qrImg.removeAttribute('src')}
}
function schedule(){clearTimeout(timer);if(stopProgress)stopProgress();stopProgress=PV.startProgress(progress,ROTATE);timer=setTimeout(step,ROTATE)}
async function step(){if(!items.length)return;await PV.transition(shell,async()=>render(items[idx++%items.length]));schedule()}
async function load(){
  try{const data=await PV.fromApi('/api/curiosidades',directData);items=Array.isArray(data.items)&&data.items.length?data.items:localFallback}catch{items=localFallback}
  idx=Math.floor(Math.random()*items.length);render(items[idx++%items.length]);shell.classList.add('is-entering');schedule();
}
load();setInterval(async()=>{try{const data=await PV.fromApi('/api/curiosidades',directData);if(Array.isArray(data.items)&&data.items.length)items=data.items}catch{}},45*60*1000);
</script>
</body></html>
