<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView • Notícias</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
.news-stage{min-height:0;display:grid;grid-template-columns:minmax(0,56%) minmax(0,44%);gap:clamp(28px,3.3vw,54px)}.copy{min-height:0;display:flex;flex-direction:column;justify-content:center}.source-row{display:flex;align-items:center;gap:12px;margin-bottom:clamp(18px,2.2vh,28px);color:var(--pv-sky);font-size:clamp(11px,.9vw,14px);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.source-logo{width:34px;height:34px;display:grid;place-items:center}.source-logo img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.16))}.headline{font-size:clamp(34px,4.5vw,74px);font-weight:650;line-height:1.04;letter-spacing:-.045em;text-wrap:balance}.desc{margin-top:clamp(20px,2.5vh,30px);font-size:clamp(15px,1.27vw,20px);line-height:1.48;color:var(--pv-soft);max-width:64ch}.media{min-height:0;position:relative;border-radius:var(--pv-radius);overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(105,207,242,.13),transparent 38%),rgba(255,255,255,.045);border:1px solid var(--pv-line)}.media img.photo{width:100%;height:100%;object-fit:cover;display:none;animation:pvImageBreath 14s ease-in-out infinite}.media.has-image img.photo{display:block}.fallback{position:absolute;inset:0;display:grid;place-items:center}.fallback span{font-size:clamp(100px,11vw,180px);color:rgba(105,207,242,.23)}.media.has-image .fallback{display:none}.media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,42,97,.01),rgba(3,42,97,.42));pointer-events:none}.qr{position:absolute;z-index:3;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;padding:9px 11px 9px 9px;border-radius:17px;background:rgba(3,42,97,.76);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(9px)}.qr.hidden{display:none}.qr img{width:68px;height:68px;border-radius:10px;background:#fff}.qr div{font-size:9px;line-height:1.25;color:rgba(255,255,255,.7);max-width:120px}.qr b{display:block;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}.progress{position:absolute;z-index:4;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08)}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--pv-sky),#fff)}.news-stage{transition:opacity .54s var(--pv-ease),transform .54s var(--pv-ease),filter .54s var(--pv-ease)}.pv-shell.is-leaving .news-stage{opacity:0;transform:translateY(10px);filter:blur(2px)}.pv-shell.is-entering .news-stage{animation:pvEnterMedia .72s var(--pv-ease) both}@media(orientation:portrait),(max-aspect-ratio:4/5){.news-stage{grid-template-columns:1fr;grid-template-rows:minmax(0,52%) minmax(0,48%);gap:22px}.headline{font-size:clamp(34px,7vw,66px)}}@media(orientation:landscape) and (max-height:760px){.news-stage{grid-template-columns:minmax(0,58%) minmax(0,42%);gap:30px}.headline{font-size:clamp(30px,3.9vw,56px)}.desc{font-size:14px;margin-top:14px}.qr img{width:56px;height:56px}}
</style></head><body><div class="pv-ambient"></div><div class="pv-shell" id="shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">newspaper</span></div><div class="pv-title">Notícias</div></div><div class="pv-source"><span class="material-symbols-outlined">rss_feed</span><span>Central RSS</span></div></header><main class="news-stage"><section class="copy"><div class="source-row"><span class="source-logo"><img id="favicon" alt=""></span><span id="source">Fonte</span></div><div class="headline" id="title">Carregando notícias...</div><div class="desc" id="desc"></div></section><section class="media" id="media"><div class="fallback"><span class="material-symbols-outlined">article</span></div><img class="photo" id="image" alt=""><div class="qr hidden" id="qr"><img id="qrImg" alt="QR Code"><div><b id="qrTitle">Leia a matéria</b><span id="qrHint">Aponte a câmera do celular</span></div></div><div class="progress"><div class="fill" id="progress"></div></div></section></main><footer class="pv-footer"><img src="../../assets/logo/pontoview-logo-white.png" alt="PontoView"></footer></div><script src="../shared/pv.js"></script><script>
const WORKER='https://pontoview-api.pedrhc258.workers.dev/api/news',MIN=22000,MAX=34000;const shell=document.getElementById('shell'),title=document.getElementById('title'),desc=document.getElementById('desc'),source=document.getElementById('source'),favicon=document.getElementById('favicon'),media=document.getElementById('media'),image=document.getElementById('image'),qr=document.getElementById('qr'),qrImg=document.getElementById('qrImg'),qrTitle=document.getElementById('qrTitle'),qrHint=document.getElementById('qrHint'),progress=document.getElementById('progress');let items=[],idx=0,timer,stop;function clean(t){return PV.clean(t).replace(/📲|👉|🔗/g,'')}function faviconUrl(u){try{return'https://www.google.com/s2/favicons?domain='+new URL(u).hostname+'&sz=128'}catch{return''}}function readTime(x){const words=clean((x.title||'')+' '+(x.description||'')).split(/\s+/).filter(Boolean).length;return Math.min(MAX,Math.max(MIN,MIN+Math.max(0,words-22)*190))}function setImage(u){image.onload=()=>media.classList.add('has-image');image.onerror=()=>{media.classList.remove('has-image');image.removeAttribute('src')};if(u)image.src='https://images.weserv.nl/?url='+encodeURIComponent(String(u).replace(/^https?:\/\//,''))+'&w=1600&h=1200&fit=cover&output=webp';else{image.removeAttribute('src');media.classList.remove('has-image')}}function render(x){title.textContent=clean(x.title)||'Notícia';desc.textContent=clean(x.description||x.summary||'');desc.style.display=desc.textContent?'':'none';source.textContent=x.source||x.sourceDomain||'Fonte';const f=faviconUrl(x.link||x.sourceUrl||'');favicon.src=f;favicon.style.display=f?'block':'none';favicon.onerror=()=>favicon.style.display='none';setImage(x.image);const link=x.link||x.sourceUrl||'';if(link){qrImg.src=PV.qrUrl(link);qr.classList.remove('hidden');qrTitle.textContent=x.link?'Leia a matéria':'Acesse a fonte';qrHint.textContent=x.link?'Aponte a câmera do celular':'Abra o portal da fonte'}else qr.classList.add('hidden')}async function fetchNews(){return await PV.fromApi('/api/noticias',()=>PV.fetchJSON(WORKER))}function schedule(x){clearTimeout(timer);if(stop)stop();const ms=readTime(x);stop=PV.startProgress(progress,ms);timer=setTimeout(step,ms)}async function step(){if(!items.length)return;const x=items[idx++%items.length];await PV.transition(shell,async()=>render(x));schedule(x)}async function load(){try{const d=await fetchNews();const arr=Array.isArray(d.items)?d.items:[];if(!arr.length)throw 0;items=arr;idx=Math.floor(Math.random()*items.length);const x=items[idx++%items.length];render(x);shell.classList.add('is-entering');schedule(x)}catch{title.textContent='Novas notícias em breve';desc.style.display='none';source.textContent='PontoView';media.classList.remove('has-image');qr.classList.add('hidden');setTimeout(load,12000)}}load();setInterval(async()=>{try{const d=await fetchNews();if(Array.isArray(d.items)&&d.items.length)items=d.items}catch{}},10*60*1000);
</script></body></html>
