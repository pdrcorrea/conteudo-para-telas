<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView • Sustentabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet">
<link rel="stylesheet" href="../shared/pontoview.css">
</head>
<body>
<div class="pv-ambient" aria-hidden="true"></div>
<div class="pv-shell" id="shell">
  <header class="pv-header">
    <div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">eco</span></div><div class="pv-title">Sustentabilidade</div></div>
    <div class="pv-source"><span class="material-symbols-outlined">location_on</span><span id="locationName">Brasil</span></div>
  </header>
  <main class="pv-stage">
    <section class="pv-copy pv-transition">
      <div class="pv-kicker" id="heroLabel">Indicador ambiental</div>
      <div class="pv-statline"><strong id="heroValue">--</strong><span id="heroUnit"></span></div>
      <p class="pv-body" id="heroText">Buscando dados ambientais de fontes abertas.</p>
    </section>
    <section class="pv-cards pv-transition">
      <article class="pv-card"><div class="pv-card-label">Energia solar local</div><div class="pv-card-value" id="solar">--</div><div class="pv-card-note" id="solarNote">NASA POWER</div></article>
      <article class="pv-card"><div class="pv-card-label">Energia renovável</div><div class="pv-card-value" id="renewable">--</div><div class="pv-card-note" id="renewableYear">Brasil</div></article>
      <article class="pv-card"><div class="pv-card-label">Área florestal</div><div class="pv-card-value" id="forest">--</div><div class="pv-card-note" id="forestYear">Brasil</div></article>
      <article class="pv-card"><div class="pv-card-label">CO₂ por habitante</div><div class="pv-card-value" id="co2">--</div><div class="pv-card-note" id="co2Year">Brasil</div></article>
    </section>
  </main>
  <footer class="pv-footer"><img src="../../assets/logo/pontoview-logo-white.png" alt="PontoView"></footer>
</div>
<script src="../shared/pv.js"></script>
<script>
const shell=document.getElementById('shell');
const e={locationName:document.getElementById('locationName'),heroLabel:document.getElementById('heroLabel'),heroValue:document.getElementById('heroValue'),heroUnit:document.getElementById('heroUnit'),heroText:document.getElementById('heroText'),solar:document.getElementById('solar'),solarNote:document.getElementById('solarNote'),renewable:document.getElementById('renewable'),renewableYear:document.getElementById('renewableYear'),forest:document.getElementById('forest'),forestYear:document.getElementById('forestYear'),co2:document.getElementById('co2'),co2Year:document.getElementById('co2Year')};
const lat=Number(PV.qs('lat','-15.793889')),lon=Number(PV.qs('lon','-47.882778')),city=PV.qs('cidade','Brasil');
let data={},slides=[],idx=0,timer=null;const ROTATE=22000;
function latestWorldBank(json){const rows=Array.isArray(json)&&Array.isArray(json[1])?json[1]:[];const row=rows.find(x=>x&&x.value!==null&&x.value!==undefined);return row?{value:Number(row.value),year:row.date}:null}
function ymd(d){return `${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,'0')}${String(d.getUTCDate()).padStart(2,'0')}`}
function latestSolar(json){
  const values=json?.properties?.parameter?.ALLSKY_SFC_SW_DWN||{};
  const rows=Object.entries(values).filter(([,v])=>Number.isFinite(Number(v))&&Number(v)>-900).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!rows.length)return null;
  const [date,value]=rows[0];
  return {value:Number(value),date:`${date.slice(6,8)}/${date.slice(4,6)}/${date.slice(0,4)}`};
}
async function directData(){
  const end=new Date();end.setUTCDate(end.getUTCDate()-1);const start=new Date(end);start.setUTCDate(start.getUTCDate()-9);
  const solarUrl=`https://power.larc.nasa.gov/api/temporal/daily/point?parameters=ALLSKY_SFC_SW_DWN&community=RE&longitude=${encodeURIComponent(lon)}&latitude=${encodeURIComponent(lat)}&start=${ymd(start)}&end=${ymd(end)}&format=JSON`;
  const base='https://api.worldbank.org/v2/country/BR/indicator/';
  const requests=[PV.fetchJSON(solarUrl),PV.fetchJSON(base+'EG.FEC.RNEW.ZS?format=json&per_page=12'),PV.fetchJSON(base+'AG.LND.FRST.ZS?format=json&per_page=12'),PV.fetchJSON(base+'EN.ATM.CO2E.PC?format=json&per_page=12')];
  const [solar,ren,forest,co2]=await Promise.allSettled(requests);
  return {location:city,solar:solar.status==='fulfilled'?latestSolar(solar.value):null,renewable:ren.status==='fulfilled'?latestWorldBank(ren.value):null,forest:forest.status==='fulfilled'?latestWorldBank(forest.value):null,co2:co2.status==='fulfilled'?latestWorldBank(co2.value):null};
}
function buildSlides(){
  slides=[];
  if(data.solar)slides.push({label:'Energia solar na localização',value:PV.formatNumber(data.solar.value,2),unit:'kWh/m²/dia',text:`Radiação solar diária mais recente disponível para ${city}. Referência: ${data.solar.date}.`});
  if(data.renewable)slides.push({label:'Energia renovável no Brasil',value:PV.formatNumber(data.renewable.value,1),unit:'%',text:`Participação de fontes renováveis no consumo final de energia. Dado de ${data.renewable.year}.`});
  if(data.forest)slides.push({label:'Área florestal no Brasil',value:PV.formatNumber(data.forest.value,1),unit:'%',text:`Percentual da área terrestre classificada como floresta. Dado de ${data.forest.year}.`});
  if(data.co2)slides.push({label:'Emissões de CO₂ no Brasil',value:PV.formatNumber(data.co2.value,2),unit:'t por pessoa',text:`Emissões anuais de dióxido de carbono por habitante. Dado de ${data.co2.year}.`});
  if(!slides.length)slides.push({label:'Atitude sustentável',value:'Menos',unit:'desperdício',text:'Economizar água, energia e materiais reduz impactos e torna os ambientes mais eficientes.'});
}
function updateCards(){
  e.solar.textContent=data.solar?PV.formatNumber(data.solar.value,2):'--';e.solarNote.textContent=data.solar?`kWh/m²/dia • ${data.solar.date}`:'NASA POWER';
  e.renewable.textContent=data.renewable?PV.formatNumber(data.renewable.value,1)+'%':'--';e.renewableYear.textContent=data.renewable?`Brasil • ${data.renewable.year}`:'Brasil';
  e.forest.textContent=data.forest?PV.formatNumber(data.forest.value,1)+'%':'--';e.forestYear.textContent=data.forest?`Brasil • ${data.forest.year}`:'Brasil';
  e.co2.textContent=data.co2?PV.formatNumber(data.co2.value,2):'--';e.co2Year.textContent=data.co2?`t/pessoa • ${data.co2.year}`:'Brasil';
}
function renderHero(s){e.heroLabel.textContent=s.label;e.heroValue.textContent=s.value;e.heroUnit.textContent=s.unit;e.heroText.textContent=s.text}
function schedule(){clearTimeout(timer);timer=setTimeout(step,ROTATE)}
async function step(){if(!slides.length)return;await PV.transition(shell,async()=>renderHero(slides[idx++%slides.length]));schedule()}
async function load(){
  e.locationName.textContent=city;
  try{const path=`/api/sustentabilidade?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&cidade=${encodeURIComponent(city)}`;data=await PV.fromApi(path,directData)}catch{data={location:city,solar:null,renewable:null,forest:null,co2:null}}
  buildSlides();updateCards();idx=0;renderHero(slides[idx++%slides.length]);shell.classList.add('is-entering');schedule();
}
load();setInterval(async()=>{try{const path=`/api/sustentabilidade?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&cidade=${encodeURIComponent(city)}`;data=await PV.fromApi(path,directData);buildSlides();updateCards()}catch{}},6*60*60*1000);
</script>
</body></html>
